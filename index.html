<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج أسعار أدوية التأمين</title>
    <link rel="icon" type="image/x-icon" href="sss.ico">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            text-align: center;
        }

        /* 🔔 شريط التحديث اللحظي الجديد (تجربة GitHub) */
        .live-banner {
            background-color: #10b981;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .container {
            padding: 20px;
        }

        h1 {
            color: #1f2937;
        }

        .info-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid #2563eb;
        }
    </style>
</head>
<body>

    <!-- 🌟 شريط التحديث التلقائي (التعديل الجديد) -->
    <div class="live-banner">
        <span class="live-dot"></span>
        <span>تجربة التحديث المباشر من GitHub: الكود شغال ومحدث الآن تلقائياً!</span>
    </div>

    <div class="container">
        <h1>💊 برنامج أسعار أدوية التأمين</h1>

        <div class="info-card">
            <h3>حالة الاتصال</h3>
            <p id="cell-b2">آخر تحديث للبيانات: جارٍ التحميل...</p>
        </div>
    </div>

    <script>
        // دالة تحديث الخلية B2 بالتاريخ الحالي
        function updateCellB2() {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            const cellB2 = document.getElementById('cell-b2');
            if (cellB2) {
                cellB2.innerText = "آخر تحديث: " + formattedDate;
            }
        }

        // تشغيل التحديث فور فتح الصفحة
        window.onload = function() {
            updateCellB2();
        };
    </script>
</body>
</html>
