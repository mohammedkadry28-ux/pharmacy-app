<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج أسعار أدوية التأمين</title>
    <!-- ربط الأيقونة بالصفحة -->
    <link rel="icon" type="image/x-icon" href="sss.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة SheetJS لقراءة ملفات الاكسيل و CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sticky-cart { position: sticky; bottom: 20px; z-index: 50; }

        /* 🔔 تأثير الوميض (Flash / Pulse) للإشعار مرتين عند الفتح */
        @keyframes notificationFlash {
            0% { opacity: 0; transform: translateY(-10px); }
            25% { opacity: 1; transform: translateY(0); }
            40% { opacity: 0.3; }
            60% { opacity: 1; }
            75% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .flash-notification {
            animation: notificationFlash 1.2s ease-in-out 1;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">

    <!-- 🟢 شريط رأس البرنامج -->
    <header class="bg-blue-900 text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                💊 برنامج حاسبة أسعار أدوية التأمين
            </h1>
            <span id="cell-b2" class="text-xs bg-blue-800 px-3 py-1.5 rounded-full border border-blue-700">
                آخر تحديث: جاري التحميل...
            </span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-4">

        <!-- 🔔 شريط الإشعارات المزود بالوميض عند التحميل -->
        <div id="notification-bar" class="hidden bg-emerald-600 text-white p-3 rounded-lg shadow-md font-semibold text-sm flex items-center justify-between border border-emerald-500">
            <span id="notification-text">🔔 جارٍ جلب البيانات...</span>
            <span class="text-xs opacity-75">تحديث مباشر</span>
        </div>

        <!-- 🔍 شريط البحث -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-sm font-semibold text-slate-700 mb-2">بحث عن دواء (بالاسم أو الكود):</label>
            <input type="text" id="searchInput" oninput="searchMedicine()" 
                   placeholder="اكتب اسم الدواء هنا..." 
                   class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg">
        </div>

        <!-- 📋 جدول عرض أدوية التأمين -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead class="bg-slate-100 text-slate-700 text-sm border-b border-slate-200">
                    <tr>
                        <th class="p-3">اسم الدواء</th>
                        <th class="p-3">السعر الأصلي</th>
                        <th class="p-3">نسبة التأمين</th>
                        <th class="p-3">المطلوب سداده</th>
                        <th class="p-3 text-center">إضافة</th>
                    </tr>
                </thead>
                <tbody id="medicineTable" class="divide-y divide-slate-100 text-sm">
                    <!-- النتائج تظهر هنا -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- 🛒 سلة المشتريات (Sticky Cart) -->
    <div class="max-w-4xl mx-auto px-4 sticky-cart">
        <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center border border-slate-700">
            <div>
                <span class="text-slate-400 text-xs block">إجمالي المطلوب من المريض:</span>
                <span id="totalPrice" class="text-2xl font-bold text-green-400">0.00 ج.م</span>
            </div>
            <button onclick="clearCart()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition">
                إعادة ضبط / سلة جديدة
            </button>
        </div>
    </div>

    <script>
        // دالة عرض الإشعار مع تطبيق انيميشن الوميض
        function triggerNotification(msg) {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            // تحديث الخلية B2
            const cellB2 = document.getElementById('cell-b2');
            if (cellB2) cellB2.innerText = "آخر تحديث: " + formattedDate;

            // إظهار صندوق النوتفيكيشن وتفعيل الوميض
            const notifBar = document.getElementById('notification-bar');
            const notifText = document.getElementById('notification-text');
            
            if (notifBar && notifText) {
                notifText.innerText = "🔔 " + msg + " (" + formattedDate + ")";
                notifBar.classList.remove('hidden');
                notifBar.classList.add('flash-notification');

                // إزالة تأثير الانيميشن بعد انتهاء الوميض لكي يعمل مرة أخرى عند الحاجة
                setTimeout(() => {
                    notifBar.classList.remove('flash-notification');
                }, 1500);
            }
        }

        let cartTotal = 0;
        function addToCart(price) {
            cartTotal += price;
            document.getElementById('totalPrice').innerText = cartTotal.toFixed(2) + " ج.م";
        }

        function clearCart() {
            cartTotal = 0;
            document.getElementById('totalPrice').innerText = "0.00 ج.م";
        }

        // تشغيل النوتفيكيشن والوميض عند فتح التطبيق
        window.onload = function() {
            triggerNotification("تم الاتصال بالسحابة وجلب أحدث بيانات الأسعار بنجاح");
        };
    </script>
</body>
</html>
